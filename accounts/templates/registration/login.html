<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Employee Management Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;

            border: none;
            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .login-header {
            background: linear-gradient(
                135deg,
                #0d6efd,
                #4f46e5
            );

            color: white;

            text-align: center;

            padding: 45px 30px;
        }

        .login-header i {
            font-size: 70px;
        }

        .login-header h2 {
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .login-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .login-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 600;
            color: #344054;
        }

        .form-control {
            min-height: 48px;

            border-radius: 10px;

            border: 1px solid #d0d5dd;

            padding: 10px 14px;

            font-size: 15px;
        }

        .form-control:focus {
            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .login-button {
            min-height: 50px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;

            background: linear-gradient(
                90deg,
                #0d6efd,
                #4f46e5
            );

            border: none;
        }

        .login-button:hover {
            opacity: 0.95;
        }

        .login-footer {
            background: #f8f9fa;

            text-align: center;

            padding: 18px;

            color: #667085;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }

        @media (max-width: 576px) {

            .login-container {
                padding: 15px;
            }

            .login-body {
                padding: 30px 25px;
            }

            .login-header {
                padding: 35px 20px;
            }

            .login-header i {
                font-size: 55px;
            }

            .login-header h2 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- ================= HEADER ================= -->

        <div class="login-header">

            <i class="bi bi-person-circle"></i>

            <h2>
                Employee Portal
            </h2>

            <p>
                Sign in to continue
            </p>

        </div>


        <!-- ================= LOGIN FORM ================= -->

        <div class="login-body">

            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="mb-4">

                    <label
                        for="id_username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >

                </div>


                <!-- Password -->

                <div class="mb-4">

                    <label
                        for="id_password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Form errors -->

                {% if form.errors %}

                    <div class="alert alert-danger">

                        <i class="bi bi-exclamation-circle me-2"></i>

                        Invalid username or password.

                    </div>

                {% endif %}


                <!-- Login button -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary login-button"
                    >

                        <i class="bi bi-box-arrow-in-right me-2"></i>

                        Login

                    </button>

                </div>


            </form>

        </div>


        <!-- ================= FOOTER ================= -->

        <div class="login-footer">

            <small>

                Employee Management Portal © 2026

            </small>

        </div>


    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
